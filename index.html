<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVK Night Network</title>
<link rel="preload" href="fonts/BungeeHairline-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="src/ui/panel.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #grain { position: fixed; inset: 0; pointer-events: none; }
  #fatal { position: fixed; left: 18px; bottom: 18px; color: #fff; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="scene"></canvas>
<div id="grain"></div>
<canvas id="overlay"></canvas>
<div id="panel" hidden></div>
<div id="fatal" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
